# server
server.port=8082

# database (Azure PostgreSQL)
spring.datasource.url=jdbc:postgresql://murata-db.postgres.database.azure.com:5432/postgres
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# OAuth2 Resource Server (JWT validation)
# Must match the `iss` claim from Auth0 tokens exactly.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://gerbitpcb.eu.auth0.com/

# Must match the `aud` claim requested by the broker/app (shared suppliers API)
supplier.security.audience=https://gerbitpcb-supplier

# CHANGE TO AZURE BROKER URL
broker.webhook-url=http://localhost:8090
