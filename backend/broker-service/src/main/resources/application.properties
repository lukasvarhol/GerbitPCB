# server
server.port=8090

# database
spring.datasource.url=jdbc:postgresql://gerbitpcb-broker-db.postgres.database.azure.com:5432/postgres
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# OAuth2 Client Credentials (Broker -> Supplier)
broker.security.oauth2.registration-id=broker
broker.security.oauth2.audience=https://gerbitpcb-supplier

spring.security.oauth2.client.registration.broker.provider=auth0
spring.security.oauth2.client.registration.broker.client-id=${AUTH0_CLIENT_ID}
spring.security.oauth2.client.registration.broker.client-secret=${AUTH0_CLIENT_SECRET}
spring.security.oauth2.client.registration.broker.authorization-grant-type=client_credentials

spring.security.oauth2.client.provider.auth0.token-uri=https://gerbitpcb.eu.auth0.com/oauth/token

# OAuth2 Resource Server (validates JWT from frontend)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://gerbitpcb.eu.auth0.com/

# Supplier endpoints (deployed Azure VMs, one per administration domain).
# Override per-environment with env vars SUPPLIERS_ENDPOINTS_MURATA / SUPPLIERS_ENDPOINTS_TI if needed.
suppliers.endpoints.Murata=http://51.120.83.88:8080
suppliers.endpoints.TI=http://74.248.131.180:8081

# --- Phase 4: async retry via Azure Service Bus ---
# Secret comes from the environment (SERVICEBUS_CONNECTION_STRING). 'enabled' defaults off so the
# broker boots with an in-memory fallback queue when Service Bus isn't configured.
app.servicebus.enabled=${SERVICEBUS_ENABLED:false}
app.servicebus.connection-string=${SERVICEBUS_CONNECTION_STRING:}
app.queue.order-retry=order-retry
app.retry.window=PT15M
app.retry.backoff=PT30S,PT1M,PT2M,PT5M
