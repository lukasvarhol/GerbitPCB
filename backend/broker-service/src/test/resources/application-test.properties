spring.datasource.url=jdbc:h2:mem:broker-testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.task.scheduling.enabled=false

# Disable the outbound Auth0 M2M client in tests so the RestTemplate has no token
# interceptor (integration tests use MockRestServiceServer, not real Auth0).
broker.security.oauth2.client-enabled=false

# No Service Bus in tests — the in-memory RetryQueue fallback is used instead.
app.servicebus.enabled=false

